# Serves the Astro static build (directory format: /install/ -> /install/index.html).
# TLS is handled upstream by Traefik; this server only listens on plain HTTP.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # don't leak the nginx version
    server_tokens off;

    # compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/ttf font/otf;

    # baseline security headers (CSP intentionally omitted — inline theme
    # script + Google Fonts; add a nonce-based CSP later if desired)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # hashed, immutable build assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg { expires 7d; access_log off; }
    location = /robots.txt  { access_log off; }

    # liveness/readiness probe — cheap, unlogged, no body to render
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # the install one-liner must be served verbatim as a script
    location = /install.sh {
        default_type text/x-shellscript;
        add_header Cache-Control "no-cache";
    }

    # clean URLs for Astro's directory output
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
