# Deploy on the Hetzner box, behind your existing Traefik.
#
#   docker compose pull && docker compose up -d
#
# Adjust two things to match YOUR Traefik:
#   • the external network name (here: "traefik")
#   • the certresolver name (here: "letsencrypt")
#
# To build locally instead of pulling GHCR, swap `image:` for `build: .`.
#
# ⚠ BREAKING (2026-09-03): the container now runs fully unprivileged and listens on 8080,
#   not 80. The HOST's copy of this file must carry `loadbalancer.server.port=8080` and the
#   tmpfs mounts below BEFORE the new image lands, or Traefik 502s / nginx crash-loops.

services:
  syscert-web:
    image: ghcr.io/tfindley/syscert-web:latest
    container_name: syscert-web
    restart: unless-stopped
    networks:
      - traefik

    # Runtime hardening. The image already runs as uid 101 with nothing root-owned that it
    # needs to write; these are the container-side half of that. Every one of them is
    # exercised by the smoke test in .github/workflows/web.yml before the image is pushed,
    # so if the image boots in CI it boots here.
    read_only: true
    # The mode is load-bearing: Docker's default tmpfs is NOT writable by uid 101, and a tmpfs
    # shadows whatever ownership the image set underneath it.
    #   /tmp             nginx.pid — the one file nginx must write on a read-only rootfs
    #   /var/cache/nginx nginx's temp paths. The current image pre-creates these, so it would
    #                    boot without this mount — but an OLDER image does not, and `read_only`
    #                    then crash-loops it with EROFS. Keep this so a ROLLBACK still boots.
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # container-level health — Docker marks the container (un)healthy and
    # `restart: unless-stopped` + watchtower act on it. Mirrors the image's
    # baked-in HEALTHCHECK; kept here so it's visible/tunable without a rebuild.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # router (HTTPS) — Traefik does TLS via its own ACME
      - "traefik.http.routers.syscert-web.rule=Host(`syscert.tfindley.dev`)"
      - "traefik.http.routers.syscert-web.entrypoints=websecure"
      - "traefik.http.routers.syscert-web.tls=true"
      - "traefik.http.routers.syscert-web.tls.certresolver=letsencrypt"
      # service → container port (8080: the image runs nginx fully unprivileged)
      - "traefik.http.services.syscert-web.loadbalancer.server.port=8080"
      # Traefik-side health — stop routing to the container if /healthz fails
      - "traefik.http.services.syscert-web.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.syscert-web.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.syscert-web.loadbalancer.healthcheck.timeout=3s"
      # optional: pull newer images automatically if you run watchtower
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  traefik:
    external: true
