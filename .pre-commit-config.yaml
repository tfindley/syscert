# Pre-commit hooks for SysCert.
#
# One-time setup (per clone):
#   brew install pre-commit      # or: pipx install pre-commit
#   pre-commit install           # wires .git/hooks/pre-commit
#
# Run manually against everything:
#   pre-commit run --all-files
#
# gitleaks scans staged changes for secrets (API keys, tokens, private keys)
# and blocks the commit if it finds any — defense against committing credentials.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
