# Pre-commit hooks for SysCert.
#
# One-time setup (per clone):
#   brew install pre-commit      # or: pipx install pre-commit
#   pre-commit install                          # gitleaks (pre-commit stage)
#   pre-commit install --hook-type commit-msg   # Conventional Commits check
#
# Run manually against everything:
#   pre-commit run --all-files
#
# gitleaks scans staged changes for secrets (API keys, tokens, private keys)
# and blocks the commit if it finds any — defense against committing credentials.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Conventional Commits check (reuses .githooks/commit-msg).
  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commits
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
        pass_filenames: false
