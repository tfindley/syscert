---
# Molecule scenario for the syscert role. Needs Podman/Docker with systemd-enabled
# images (the role manages a systemd timer). Not runnable without a container engine.
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: syscert-rocky9
    image: quay.io/rockylinux/rockylinux:9
    command: /usr/sbin/init
    systemd: always
    capabilities:
      - SYS_ADMIN
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: syscert-debian12
    image: quay.io/ansible-community/test-image:debian-12
    command: /usr/lib/systemd/systemd
    systemd: always
    capabilities:
      - SYS_ADMIN
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
verifier:
  name: ansible
