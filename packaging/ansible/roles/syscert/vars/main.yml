---
# vars/main.yml — internal, computed values (not meant to be overridden).
# Still syscert_-prefixed to satisfy ansible-lint var-naming. Lazily evaluated,
# so the play must gather facts (ansible_architecture, selinux, fqdn).

# Map Ansible's architecture fact to the release asset suffix.
syscert_arch_map:
  x86_64: amd64
  aarch64: arm64
syscert_arch: "{{ syscert_arch_map[ansible_architecture] | default('') }}"
syscert_release_filename: "syscert-linux-{{ syscert_arch }}"
syscert_release_url: "{{ syscert_download_base_url }}/{{ syscert_version | default('') }}/{{ syscert_release_filename }}"
syscert_sums_url: "{{ syscert_download_base_url }}/{{ syscert_version | default('') }}/sha256sums.txt"

# True when SELinux is enforcing/permissive (so file ops set contexts and the
# binary is pinned to bin_t).
syscert_selinux_enabled: "{{ (ansible_facts.selinux.status | default('disabled')) == 'enabled' }}"

# Effective challenge serves on :80/:443 → the service needs CAP_NET_BIND_SERVICE.
# (IP SANs auto-switch a DNS challenge to http-01 — keep in sync with config.EffectiveChallenge.)
syscert_serves_inbound: "{{ syscert_acme_challenge in ['http-01', 'tls-alpn-01'] or (syscert_cert_ip_sans | length > 0) }}"
# Operator override (space-separated) wins; otherwise CAP_CHOWN, plus CAP_NET_BIND_SERVICE when inbound.
syscert_capabilities: >-
  {{ syscert_service_ambient_capabilities.split()
     if (syscert_service_ambient_capabilities | length > 0)
     else ['CAP_CHOWN'] + (['CAP_NET_BIND_SERVICE'] if syscert_serves_inbound else []) }}

# Every directory outside the store that the service writes: each distribute
# target's parent plus any enabled [observe] output. One definition, used by both
# the directory/ACL tasks and the unit's ReadWritePaths, so the grant and the
# thing being granted can never drift apart.
syscert_observe_dirs: >-
  {{ ([syscert_metrics_file | dirname] if syscert_metrics_enabled else [])
     + ([syscert_ansible_facts_file | dirname] if syscert_ansible_facts_enabled else []) }}
syscert_writable_dirs: >-
  {{ ((syscert_distribute | map(attribute='path') | map('dirname') | list)
      + syscert_observe_dirs) | unique | list }}

# Of those, the ones an ACL may be applied to. Excludes the store (already
# syscert-owned; granting there would fight tasks/user.yml and the 0700 that
# assert.yml protects) and anything shallower than two path components — a
# mistyped `path: /etc/x.pem` yields /etc, and granting write across a whole
# top-level tree is never what was meant. packaging/install.sh refuses the same
# shape, so the two install routes agree.
syscert_grantable_dirs: >-
  {{ syscert_writable_dirs
     | reject('equalto', syscert_store_path)
     | select('match', '^(/[^/]+){2,}/?$') | list }}
syscert_ungrantable_dirs: >-
  {{ syscert_writable_dirs
     | reject('equalto', syscert_store_path)
     | reject('match', '^(/[^/]+){2,}/?$') | list }}
