name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["web/**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: gofmt + go vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  # The Ansible role ships in-tree but is not Go, so nothing above looks at it.
  # ansible-lint runs the `production` profile (see packaging/ansible/.ansible-lint)
  # and the syntax check parses the example playbook. Molecule is deliberately NOT
  # here: it needs systemd-in-container under privileged podman and fetches a real
  # release, so it stays a local/opt-in check (see packaging/ansible/README.md).
  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install --disable-pip-version-check ansible-core ansible-lint

      # The config lives beside the role, not at the repo root, so run from there.
      - name: ansible-lint
        working-directory: packaging/ansible
        run: ansible-lint

      - name: Playbook syntax check
        working-directory: packaging/ansible
        run: ansible-playbook --syntax-check playbook.example.yml

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  security:
    name: govulncheck + gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Known-vulnerability scan against the Go vuln DB (low-noise, gating).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Static security analysis. The same scans scripts/prerelease.sh runs locally.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet ./...
