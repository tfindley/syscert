name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release + upload assets
      id-token: write       # OIDC for provenance attestation
      attestations: write   # attest binary provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            echo "building linux/$arch"
            GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=v${VERSION} -X main.date=${BUILD_DATE}" \
              -o "dist/syscert-linux-${arch}" ./cmd/syscert
          done
          ( cd dist && sha256sum syscert-linux-* > sha256sums.txt && cat sha256sums.txt )

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/syscert-linux-*

      # The curated CHANGELOG entry IS the release note — including the hand-written
      # "Risk & Security" section that scripts/prerelease.sh requires before a
      # release can go out. Previously the published release showed only the asset
      # table plus GitHub's auto-generated commit list, so none of that reached
      # anyone reading the release page.
      - name: Compose release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Extract FIRST and check it on its own: the boilerplate above is far
          # larger than any sane threshold, so measuring the finished file would
          # never catch a missing section.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[v" ver "\\]" { grab = 1; next }
            grab && /^## \[v/ { exit }
            grab { print }
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::error::CHANGELOG.md has no section for v$VERSION — run scripts/prerelease.sh first"
            exit 1
          fi
          if grep -q 'TODO: summarise the security impact' changelog-section.md; then
            echo "::error::the Risk & Security note for v$VERSION is still the TODO placeholder"
            exit 1
          fi
          {
            printf '## SysCert v%s\n\n' "$VERSION"
            printf 'Static Linux binaries (no runtime dependencies).\n\n'
            printf '| Arch | Asset |\n|---|---|\n'
            printf '| x86-64 | `syscert-linux-amd64` |\n'
            printf '| arm64  | `syscert-linux-arm64` |\n\n'
            printf 'Verify downloads against `sha256sums.txt`. See the '
            printf '[README](https://github.com/%s/blob/main/README.md) for setup.\n\n' "$REPO"
            cat changelog-section.md
          } > release-notes.md
          echo "release notes: $(wc -l < release-notes.md) lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SysCert v${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: |
            dist/syscert-linux-amd64
            dist/syscert-linux-arm64
            dist/sha256sums.txt
          generate_release_notes: true
