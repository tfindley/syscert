# syscert sidecar — RECOMMENDED
# ------------------------------------------------------------------------------
# Two containers share a cert volume. syscert runs the ensure loop (--interval
# 12h); nginx reads the volume read-only. Neither container needs root.
#
# dns-01 is the default and the right choice in containers — it needs no inbound
# ports and cannot conflict with nginx's :80/:443. http-01/tls-alpn-01 bind
# :80/:443 directly and CANNOT coexist with nginx. There is no webroot mode.
#
# Volume ownership: the cert volume must be owned by the uid syscert runs as.
# The image runs as a non-root user; set the volume mount's uid:gid to match.
# A wrong owner causes a silent EACCES — syscert fails to write the store.
#
# Secrets: put your DNS-provider credentials in a .env file (0600) or Docker
# secrets — never bake them into the image or the compose file.
# ------------------------------------------------------------------------------

services:
  syscert:
    image: alpine:latest          # replace with your own image that contains syscert
    # COPY the static binary into a custom image, e.g.:
    #   FROM alpine:latest
    #   COPY syscert /usr/local/bin/syscert
    user: "1000:1000"             # run as a non-root uid; must own the cert volume
    command:
      - syscert
      - --interval
      - 12h
      - --config
      - /etc/syscert/syscert.toml
      - --env-file
      - /run/secrets/syscert_secrets
    volumes:
      - ./syscert.toml:/etc/syscert/syscert.toml:ro
      - certs:/var/lib/syscert   # store — must be writable by uid 1000
    env_file:
      - .env                     # DNS-provider credentials, e.g. CLOUDFLARE_DNS_API_TOKEN=…
    restart: unless-stopped
    # SIGTERM shuts down cleanly after the current cycle (30 s Docker grace period).

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/tls:ro  # read-only — nginx reads, syscert writes
    depends_on:
      - syscert
    restart: unless-stopped
    # Reload nginx to pick up a renewed cert. Options (pick one):
    #   (a) a periodic cron inside nginx — add to your nginx image:
    #         echo "0 */12 * * * nginx -s reload" | crontab -
    #   (b) the optional reload-helper.sh sidecar (see reload-helper.sh)
    #   (c) a separate compose service that runs `docker exec nginx nginx -s reload`
    #       on a timer.

volumes:
  certs:
    driver: local
    # Ensure the volume directory is owned by uid 1000 before first run:
    #   docker run --rm -v syscert_certs:/vol alpine chown 1000:1000 /vol
    # A wrong owner = EACCES on the store → cert not written → nginx serves nothing.
