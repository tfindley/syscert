# syscert scheduled (one-shot) — RECOMMENDED for most setups
# ------------------------------------------------------------------------------
# The simplest Docker Compose pattern: syscert runs once (no --interval), writes
# the cert to a named volume, then exits. An external timer (cron, systemd timer,
# or a CI scheduler) re-runs the service on a schedule (e.g. daily).
#
# This pattern mirrors the host systemd-timer model: one-shot binary on a
# schedule — no long-running process, easy to inspect, trivially restartable.
#
# For the Kubernetes-native equivalent, see k8s-cronjob.yaml in this directory.
#
# dns-01 is the default — no inbound ports needed, no conflict with nginx/apache.
# ------------------------------------------------------------------------------

services:
  syscert:
    image: alpine:latest          # replace with your own image containing syscert
    user: "1000:1000"             # must own the cert volume
    command:
      - syscert
      - --config
      - /etc/syscert/syscert.toml
      - --env-file
      - /run/secrets/syscert_secrets
    volumes:
      - ./syscert.toml:/etc/syscert/syscert.toml:ro
      - certs:/var/lib/syscert
    env_file:
      - .env                     # DNS-provider credentials
    restart: "no"                # one-shot — the external timer re-runs it

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/tls:ro
    restart: unless-stopped
    # Reload nginx after syscert runs. One approach:
    #   docker compose run syscert && docker exec nginx nginx -s reload

volumes:
  certs:
    driver: local
    # Fix volume ownership before first run:
    #   docker run --rm -v <project>_certs:/vol alpine chown 1000:1000 /vol
