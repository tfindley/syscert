# HashiCorp Vault (internal CA) via HTTP-01
# ------------------------------------------------------------------------------
# Internal cert from Vault's PKI ACME endpoint. ca = "custom" + directory_url.
#
# NOTE: Vault PKI ACME supports http-01 and tls-alpn-01 ONLY — it has no dns-01.
# Use IPv4 in the directory URL (Vault has an IPv6-ACME quirk). The PKI mount
# needs ACME enabled (`vault write pki/config/acme enabled=true` + a
# `pki/config/cluster path=...`).
# Every option, annotated: examples/full.toml

[cert]
hostname = "app01.internal.lan"   # change me (or remove to use the system FQDN)
key_type = "ec256"

[acme]
ca            = "custom"
directory_url = "https://vault.example.com:8200/v1/pki/acme/directory"
email         = "ops@example.com"
challenge     = "http-01"          # Vault: http-01 or tls-alpn-01 (NOT dns-01)

# If the host doesn't trust Vault's CA yet, trust it for the ACME CONNECTION
# only to bootstrap (SysCert warns); then run `sudo syscert trust install` to
# add it host-wide. See ADR-0035.
# ca_bundle   = "/etc/syscert/vault-ca.pem"

# If Vault's eab_policy requires External Account Binding, mint a token
# (vault write -f pki/acme/new-eab) and set the kid here + the HMAC in the env:
# [acme.eab]
# kid = "id-from-vault"            # + export SYSCERT_EAB_HMAC=<key-from-vault>

[store]
path = "/var/lib/syscert"

[[distribute]]
artifact = "fullchain"
path     = "/etc/nginx/tls/fullchain.pem"
owner    = "root"
group    = "root"
mode     = "0644"

[[distribute]]
artifact = "privkey"
path     = "/etc/nginx/tls/privkey.pem"
owner    = "root"
group    = "root"
mode     = "0600"

[logging]
level  = "info"
format = "text"
